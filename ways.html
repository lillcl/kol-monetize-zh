<style>
:root{
  --ink:#0E0F11;--paper:#F4F1EA;--paper-deep:#EAE5D6;--rule:#D8D2C4;
  --muted:#6B6557;--red:#D2453A;--green:#3A5A40;
  --display:'Fraunces','Noto Serif TC',ui-serif,Georgia,serif;
  --body:'Newsreader','Noto Serif TC',ui-serif,Georgia,serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);font:18px/1.6 var(--body);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body{font-feature-settings:"palt"}
a{color:inherit;text-decoration:none;border-bottom:1px solid var(--rule)}
::selection{background:var(--ink);color:var(--paper)}

.mast{padding:14px 28px;border-bottom:1px solid var(--rule);display:flex;justify-content:space-between;align-items:center;font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);position:sticky;top:0;background:var(--paper);z-index:50}
.mast b{color:var(--ink);letter-spacing:.18em}
.mast a{border:0;color:inherit}
.mast .links{display:flex;gap:18px}
.mast .links a:hover{color:var(--red)}

.hero{padding:64px 28px 32px;border-bottom:1px solid var(--rule)}
.hero .label{font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--red);margin-bottom:16px}
.hero h1{font-family:var(--display);font-size:clamp(36px,5.5vw,64px);line-height:1;letter-spacing:-.04em;font-weight:500;margin:0 0 16px;max-width:18ch}
.hero h1 em{font-style:italic;font-weight:400;color:var(--red)}
.hero .lede{font-size:19px;line-height:1.55;max-width:48ch;color:var(--ink);margin:0;font-weight:400}
.hero .stats{display:flex;gap:32px;margin-top:24px;font-family:var(--mono);font-size:12px;color:var(--muted);flex-wrap:wrap}
.hero .stats div{display:flex;flex-direction:column;gap:4px}
.hero .stats b{color:var(--ink);font-size:24px;font-family:var(--display);font-weight:500}

.filters{padding:18px 28px;border-bottom:1px solid var(--rule);display:flex;gap:8px;flex-wrap:wrap;background:var(--paper);position:sticky;top:46px;z-index:40}
.filters button{border:1px solid var(--ink);background:transparent;padding:8px 14px;font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;color:var(--ink);transition:background .12s,color .12s}
.filters button:hover{background:var(--ink);color:var(--paper)}
.filters button.active{background:var(--ink);color:var(--paper)}
.filters .sep{width:1px;background:var(--rule);margin:0 6px;align-self:stretch}
.filters input{border:1px solid var(--rule);background:transparent;padding:8px 12px;font-family:var(--body);font-size:14px;width:220px;outline:none}
.filters input:focus{border-color:var(--ink)}

.grid-wrap{padding:24px 28px 64px;max-width:1440px;margin:0 auto}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}

.card{background:#fff;border:1px solid var(--ink);display:flex;flex-direction:column;transition:transform .15s}
.card:hover{transform:translateY(-2px)}
.card .pic{aspect-ratio:1;background:#222;overflow:hidden;position:relative;flex:none}
.card .pic img{width:100%;height:100%;object-fit:cover;background:#222}
.card .pic .region{position:absolute;top:10px;left:10px;background:var(--ink);color:var(--paper);font-family:var(--mono);font-size:9px;letter-spacing:.12em;padding:4px 7px;text-transform:uppercase}
.card .pic .cat{position:absolute;top:10px;right:10px;background:rgba(255,255,255,.92);color:var(--ink);font-family:var(--mono);font-size:9px;letter-spacing:.1em;padding:4px 7px;text-transform:uppercase}
.card .body{padding:18px;display:flex;flex-direction:column;flex:1}
.card .name{font-family:var(--display);font-size:20px;font-weight:500;margin:0 0 2px;letter-spacing:-.01em}
.card .sub{font-style:italic;color:var(--muted);font-size:14px;margin-bottom:12px;font-family:var(--display)}
.card .product{font-family:var(--body);font-size:15px;line-height:1.5;margin:0 0 14px;color:var(--ink);flex:1}
.card .meta{font-family:var(--mono);font-size:11px;color:var(--muted);border-top:1px solid var(--rule);padding-top:10px;display:flex;flex-direction:column;gap:6px}
.card .meta .row{display:flex;justify-content:space-between;gap:10px;align-items:center}
.card .meta .row b{color:var(--red);font-weight:500}
.card .meta .row .rev{color:var(--green);font-weight:500}
.card .meta .row .rev.est{color:var(--muted);font-weight:400}
.card .platform{margin-top:10px;font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--ink);text-transform:uppercase}
.card .src{margin-top:10px;display:inline-block;font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--ink);border:1px solid var(--ink);padding:6px 10px;text-transform:uppercase;align-self:flex-start}
.card .src:hover{background:var(--ink);color:var(--paper)}

.empty{grid-column:1/-1;text-align:center;padding:80px 20px;color:var(--muted);font-style:italic;font-family:var(--display);font-size:22px}

footer{padding:24px 28px;border-top:1px solid var(--rule);display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}

@media(max-width:1100px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:680px){
  .grid{grid-template-columns:1fr}
  .hero{padding:40px 22px 24px}
  .filters{padding:14px 22px}
  .grid-wrap{padding:18px 22px 48px}
  .filters input{width:100%}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

const grid = document.getElementById('grid');
const catBtns = document.querySelectorAll('.filters button[data-cat]');
const search = document.getElementById('search');
let activeCat = 'all';
let activeSearch = '';

function render() {
  const filtered = ITEMS.filter(item => {
    const catMatch = activeCat === 'all' || item.category === activeCat;
    if (!catMatch) return false;
    if (!activeSearch) return true;
    const q = activeSearch.toLowerCase();
    return (item.kol_name + ' ' + item.product_name + ' ' + item.platform + ' ' + item.subcategory).toLowerCase().includes(q);
  });
  if (filtered.length === 0) {
    grid.innerHTML = '<div class="empty">沒有符合的案例</div>';
    return;
  }
  grid.innerHTML = filtered.map(item => {
    const rev = item.revenue;
    const revClass = rev.type === 'reported' ? 'rev' : 'rev est';
    return `<article class="card">
      <div class="pic">
        <img src="${item.kol_photo}" alt="${item.kol_name}" loading="lazy" onerror="this.style.background='#222';this.style.opacity='.3'">
        <span class="region">${item.kol_followers}</span>
        <span class="cat">${item.category.replace(' & ', '/').replace(' Products', '')}</span>
      </div>
      <div class="body">
        <h3 class="name">${item.kol_name}</h3>
        <div class="sub">${item.subcategory}</div>
        <p class="product">${item.description}</p>
        <div class="meta">
          <div class="row"><span>產品</span><b>${item.product_name}</b></div>
          <div class="row"><span>價格</span><b>${item.price}</b></div>
          <div class="row"><span>營收</span><span class="${revClass}" title="${rev.math}">${rev.amount}${rev.type === 'estimated' ? ' *' : ''}</span></div>
        </div>
        <div class="platform">${item.platform}</div>
        <a class="src" href="${item.url}" target="_blank" rel="noopener">看商品頁 →</a>
      </div>
    </article>`;
  }).join('');
}

catBtns.forEach(btn => btn.addEventListener('click', () => {
  catBtns.forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  activeCat = btn.dataset.cat;
  render();
}));

search.addEventListener('input', e => {
  activeSearch = e.target.value;
  render();
});

render();
</script>
