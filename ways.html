<style>
:root{

*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);font:17px/1.55 var(--body);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body{font-feature-settings:"palt"}
a{color:inherit;text-decoration:none;border-bottom:1px solid var(--rule)}
::selection{background:var(--ink);color:var(--paper)}

.mast{padding:14px 28px;border-bottom:1px solid var(--rule);display:flex;justify-content:space-between;align-items:center;font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);position:sticky;top:0;background:var(--paper);z-index:50}
.mast b{color:var(--ink);letter-spacing:.18em}
.mast a{border:0;color:inherit}
.mast a:hover{color:var(--red)}
.mast .links{display:flex;gap:18px}
.mast .links a.active{color:var(--red)}

.hero{padding:48px 28px 24px;border-bottom:1px solid var(--rule)}
.hero .label{font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--red);margin-bottom:14px}
.hero h1{font-family:var(--display);font-size:clamp(32px,5vw,56px);line-height:1;letter-spacing:-.03em;font-weight:500;margin:0 0 12px;max-width:20ch}
.hero h1 em{font-style:italic;font-weight:400;color:var(--red)}
.hero .lede{font-size:18px;line-height:1.55;max-width:54ch;color:var(--ink);margin:0;font-weight:400}
.hero .stats{display:flex;gap:28px;margin-top:18px;font-family:var(--mono);font-size:11px;color:var(--muted);flex-wrap:wrap}
.hero .stats div{display:flex;flex-direction:column;gap:2px}
.hero .stats b{color:var(--ink);font-size:20px;font-family:var(--display);font-weight:500}

.filters{padding:14px 28px;border-bottom:1px solid var(--rule);display:flex;gap:6px;flex-wrap:wrap;background:var(--paper);position:sticky;top:46px;z-index:40;align-items:center}
.filters button{border:1px solid var(--ink);background:transparent;padding:7px 12px;font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;color:var(--ink);transition:background .12s,color .12s}
.filters button:hover{background:var(--ink);color:var(--paper)}
.filters button.active{background:var(--ink);color:var(--paper)}
.filters input{border:1px solid var(--rule);background:transparent;padding:7px 11px;font-family:var(--body);font-size:14px;width:220px;outline:none;margin-left:6px}
.filters input:focus{border-color:var(--ink)}

.grid-wrap{padding:24px 28px 48px;max-width:1440px;margin:0 auto}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}

.card{background:#fff;border:1px solid var(--ink);display:flex;flex-direction:column;transition:transform .15s}
.card:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(16,24,40,.08)}
.card .head{height:88px;display:block;position:relative;flex:none;overflow:hidden;background:var(--ink)}
.card .head img{width:100%;height:100%;object-fit:cover;object-position:center 22%;filter:saturate(.92) contrast(1.03);display:block}
.card .head .fb{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:26px;font-weight:500;color:rgba(255,255,255,.92);letter-spacing:-.01em}
.card .head .cat{position:absolute;top:8px;right:8px;font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:#fff;background:rgba(14,15,17,.82);padding:3px 6px}
.card .body{padding:14px 14px 16px;display:flex;flex-direction:column;flex:1}
.card .name{font-family:var(--display);font-size:17px;font-weight:500;margin:0 0 2px;letter-spacing:-.01em;line-height:1.15}
.card .sub{font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:var(--muted);margin-bottom:8px;text-transform:uppercase}
.card .product{font-family:var(--body);font-size:14px;line-height:1.4;margin:0 0 10px;color:var(--ink);flex:1}
.card .meta{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;padding-top:8px;border-top:1px solid var(--rule);font-family:var(--mono);font-size:10px;color:var(--muted)}
.card .meta b{color:var(--red);font-weight:500;display:block;font-size:13px;line-height:1.2;margin-top:1px}
.card .meta .rev{color:var(--green);font-weight:500}
.card .meta .rev.est{color:var(--ink);font-weight:400}
.card .src{display:block;text-align:center;margin-top:10px;font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--ink);border:1px solid var(--ink);padding:7px 10px;text-transform:uppercase;background:transparent;transition:background .12s,color .12s}
.card .src:hover{background:var(--ink);color:var(--paper)}

.empty{grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--muted);font-style:italic;font-family:var(--display);font-size:20px}

footer{padding:20px 28px;border-top:1px solid var(--rule);display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}

@media(max-width:1200px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){
  .grid{grid-template-columns:1fr}
  .hero{padding:36px 22px 20px}
  .filters{padding:12px 22px}
  .grid-wrap{padding:18px 22px 36px}
  .filters input{width:100%;margin-left:0;margin-top:6px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

const grid = document.getElementById('grid');
const catBtns = document.querySelectorAll('.filters button[data-cat]');
const search = document.getElementById('search');
let activeCat = 'all';
let activeSearch = '';

function render() {
  const filtered = ITEMS.filter(item => {
    const catMatch = activeCat === 'all' || item.category === activeCat;
    if (!catMatch) return false;
    if (!activeSearch) return true;
    const q = activeSearch.toLowerCase();
    return (item.kol_name + ' ' + item.product_name + ' ' + item.platform + ' ' + item.subcategory).toLowerCase().includes(q);
  });
  if (filtered.length === 0) {
    grid.innerHTML = '<div class="empty">沒有符合的案例</div>';
    return;
  }
  grid.innerHTML = filtered.map(item => {
    const rev = item.revenue;
    const revClass = rev.type === 'reported' ? 'rev' : 'rev est';
    const catLabel = item.category.replace(' & ', '/').replace(' Products', '');
    const col = color(item.kol_name);
    const ph = PHOTO[item.kol_name];
    return `<article class="card">
      <div class="head" style="background:${col}">
        ${ph?`<img src="${ph}" alt="${item.kol_name}" loading="lazy">`:`<span class="fb">${initials(item.kol_name)}</span>`}
        <span class="cat">${catLabel}</span>
      </div>
      <div class="body">
        <h3 class="name">${item.kol_name}</h3>
        <div class="sub">${item.subcategory}</div>
        <p class="product">${item.description}</p>
        <div class="meta">
          <div><span>產品</span><b>${item.product_name}</b></div>
          <div><span>價格</span><b>${item.price}</b></div>
          <div><span>營收</span><b class="${revClass}">${rev.amount}</b></div>
          <div><span>平台</span><b style="font-size:11px">${item.platform}</b></div>
        </div>
        <a class="src" href="${item.url}" target="_blank" rel="noopener">看商品頁 →</a>
      </div>
    </article>`;
  }).join('');
}

catBtns.forEach(btn => btn.addEventListener('click', () => {
  catBtns.forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  activeCat = btn.dataset.cat;
  render();
}));

search.addEventListener('input', e => {
  activeSearch = e.target.value;
  render();
});

render();
</script>
